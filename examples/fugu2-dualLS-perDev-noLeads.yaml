# Per-device extraction for Fugu2 with 2 LS FETs: Q2 + D9 (DNP Schottky TO-220
# position repurposed as LS MOSFET, gate hand-wired to Q2's gate).
#
# D9's drain (pad 2) is on SW and source (pad 3) is on BuckGND — already
# correct for a parallel LS FET. Only the gate (pad 1) is on BuckGND on the
# PCB. The gate_net_override reassigns D9 pad 1 to Net-(Q2-G) in memory and
# adds a synthetic B.Cu track to Q2's gate pad so FastHenry can mesh the
# gate wire. No PCB file patching needed.
#
# Run:
#   python3 extract_parasitics.py --config examples/fugu2-dualLS-perDev-noLeads.yaml
# Fugu2 board pinned to e8bb240 (2026-09-02, GitHub main): the latest 50 x 88 mm board
# on which every Fugu2 example builds its mesh with all ports connected (fugu2-cu,
# fugu2-HSlump-noLeads and ReboostV2 then stop at the scalar-Cin validity check, a
# refusal of the cap model, not of the board; pass --allow-scalar-cin or use the
# matrix Cin model). Later boards: 1b13241 (op-amp current sense)
# leaves P_pwr's ground pad unbonded at 1 mm pitch and has no T_HV+ copper;
# 971ab77 widened the board to 58.5 mm and dropped Net-(Q2-G). The working copy
# is read only to locate the repository.
pcb: ../../../../../ee/hw/Fugu2/Fugu2.kicad_pcb
pcb_rev: e8bb240067fc6af078344b42ae14f68ecbfd1aa4
sw: SW
gnd: BuckGND
vin: Solar+
hs_ref: [Q1, Q3]
ls_ref: [Q2, D9]
parallel_fets: per-device
gate_net_override:
  D9: "Net-(Q2-G)"
lead_mm: 0
cin_loop_refs: [C9, C16, C17, C18, C21, C22, C27]
pitch: [1]
lf_freq: 39000
emit_cin_network: true
cin_network_model: matrix
weld_tol: 0.6
zone_mesh: grid
margin: 8.0
out: out/fugu2-dualLS-perDev
svg: true
