# Fugu2 COPPER-ONLY commutation-loop extraction for the LOSS deck consumer.
# lead_mm=0.1 -> the die-plane short sits ~on the board, so L_loop is board copper
# only (~4.1 nH). The loss deck (deck.py) supplies the FET package leads itself
# (TO-220 Ld/Ls table); pairing it with a lead-inclusive extraction (the default
# examples/fugu2.yaml, lead_mm=3 -> 8.2 nH) double-counts the leads and rings ~2x
# too inductive. Use THIS config for loss; use examples/fugu2.yaml (lead-inclusive)
# for DPT/gate-drive sims that want the full package. --lead-mm 0 trips the
# zero-length-filament SVD guard, so 0.1 mm is the copper-only stand-in.
# See fl4p/dcdc-tools#3.
# Fugu2 board pinned to e8bb240 (2026-09-02, GitHub main): the latest 50 x 88 mm board
# on which every Fugu2 example builds its mesh with all ports connected (fugu2-cu,
# fugu2-HSlump-noLeads and ReboostV2 then stop at the scalar-Cin validity check, a
# refusal of the cap model, not of the board; pass --allow-scalar-cin or use the
# matrix Cin model). Later boards: 1b13241 (op-amp current sense)
# leaves P_pwr's ground pad unbonded at 1 mm pitch and has no T_HV+ copper;
# 971ab77 widened the board to 58.5 mm and dropped Net-(Q2-G). The working copy
# is never read: pcb_repo names the repository and pcb's path inside it.
pcb: ../../../../../ee/hw/Fugu2/Fugu2.kicad_pcb
pcb_rev: e8bb240067fc6af078344b42ae14f68ecbfd1aa4
pcb_repo: ../../../../../ee/hw/Fugu2   # the pin reads Fugu2.kicad_pcb from this repository
sw: SW
gnd: BuckGND
vin: Solar+
hs_ref: [Q1, Q3]
ls_ref: [Q2]
cin_refs: [C9, C16, C17, C18, C21, C22] # without C27
pitch: [1.0]
lead_mm: 0.1
lf_freq: 39000
emit_cin_network: true
weld_tol: 0.6
margin: 8.0
out: out/fugu2-cu/
svg: true
